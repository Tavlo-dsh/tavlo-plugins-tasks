name: Publish npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package from main
        type: boolean
        default: false
      bootstrap:
        description: Use the one-time NPM_BOOTSTRAP_TOKEN for a new package
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Verify the release ref and package
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const ref = process.env.GITHUB_REF
          if (name !== '@tavlo-dsh/dsh-plugin-tasks') throw new Error(`Unexpected package: ${name}`)
          if (ref !== 'refs/heads/main' && ref !== `refs/tags/v${version}`) {
            throw new Error(`Expected main or v${version}, got ${ref}`)
          }
          NODE
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - run: npm ci
      - run: npm test
      - name: Pack the tested build
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          archive=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release")
          mv "$RUNNER_TEMP/npm-release/$archive" "$RUNNER_TEMP/npm-release/package.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-release/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release
      - name: Publish with npm Trusted Publishing
        if: github.event_name != 'workflow_dispatch' || !inputs.bootstrap
        run: npm publish ./release/package.tgz --ignore-scripts --provenance --access public
      - name: First publication with a one-time npm token
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          : "${NODE_AUTH_TOKEN:?Configure NPM_BOOTSTRAP_TOKEN in this repository first}"
          npm publish ./release/package.tgz --ignore-scripts --provenance --access public
